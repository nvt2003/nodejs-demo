<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Quản lý User</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- Vị trí chứa Navbar -->
    <div id="navbar-container"></div>

    <div class="container">
      <h1>Quản lý User</h1>

      <!-- Form -->
      <div class="card">
        <h2 id="form-title">Thêm người dùng</h2>

        <form id="user-form">
          <input type="hidden" id="user-id" />

          <div class="form-group">
            <label>Tên người dùng</label>

            <input type="text" id="name" required />
          </div>

          <div class="form-group">
            <label>Email</label>

            <input type="email" id="email" required />
          </div>

          <div class="form-group">
            <label>Mật khẩu</label>

            <input type="password" id="password" />
          </div>

          <div class="form-group">
            <label>Ảnh đại diện</label>

            <input type="file" id="image" accept="image/*" />
          </div>

          <button type="submit">Lưu người dùng</button>

          <button
            type="button"
            id="cancel-btn"
            class="cancel"
            style="display: none"
          >
            Hủy
          </button>
        </form>
      </div>
      <!-- Cụm Nút -->
      <div
        class="csv-actions"
        style="margin: 20px 0; display: flex; gap: 10px; align-items: center"
      >
        <!-- Nút Export -->
        <button id="export-btn" type="button" class="btn-export">
          Export CSV
        </button>

        <!-- Input và Nút Import -->
        <input
          type="file"
          id="csv-file-input"
          accept=".csv"
          style="display: none"
        />
        <button id="import-btn" type="button" class="btn-import">
          Import CSV
        </button>
        <!-- Nút mở giao diện gửi email -->
        <button id="send-email-btn" type="button" class="btn-email">
          Gửi Email
        </button>
      </div>
      <!-- Danh sách user -->

      <div class="card">
        <h2>Danh sách người dùng</h2>

        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Ảnh</th>
              <th>Tên</th>
              <th>Email</th>
              <th>Thao tác</th>
            </tr>
          </thead>

          <tbody id="user-list"></tbody>
        </table>
      </div>
    </div>
    <!-- Modal Soạn Email -->
    <div
      id="email-modal"
      class="modal"
      style="
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
      "
    >
      <div
        style="
          background-color: #fff;
          margin: 8% auto;
          padding: 20px;
          border-radius: 8px;
          width: 420px;
          max-width: 90%;
        "
      >
        <h3 style="margin-top: 0">Soạn Email</h3>

        <!-- Ô NHẬP EMAIL (TEXT INPUT) -->
        <div style="margin-bottom: 12px">
          <label style="display: block; margin-bottom: 4px">Gửi đến:</label>
          <input
            type="text"
            id="email-to"
            style="width: 100%; padding: 8px; box-sizing: border-box"
            placeholder="VD: user@gmail.com hoặc ALL để gửi tất cả"
          />
        </div>

        <div style="margin-bottom: 12px">
          <label style="display: block; margin-bottom: 4px"
            >Tiêu đề (Subject):</label
          >
          <input
            type="text"
            id="email-subject"
            style="width: 100%; padding: 8px; box-sizing: border-box"
            placeholder="Nhập tiêu đề email..."
          />
        </div>

        <div style="margin-bottom: 15px">
          <label style="display: block; margin-bottom: 4px"
            >Nội dung (Content):</label
          >
          <textarea
            id="email-content"
            rows="5"
            style="width: 100%; padding: 8px; box-sizing: border-box"
            placeholder="Nhập nội dung email..."
          ></textarea>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 10px">
          <button
            type="button"
            id="close-email-modal"
            style="padding: 8px 16px"
          >
            Hủy
          </button>
          <button
            type="button"
            id="confirm-send-email"
            style="
              padding: 8px 16px;
              background-color: #007bff;
              color: white;
              border: none;
              border-radius: 4px;
            "
          >
            Gửi
          </button>
        </div>
      </div>
    </div>
    <!-- <script src="app.js"></script> -->
    <script type="module" src="./app.js"></script>
  </body>
</html>
